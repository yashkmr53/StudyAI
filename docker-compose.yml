services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyai}
      POSTGRES_USER: ${POSTGRES_USER:-studyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      # Initialize restricted RLS role
      POSTGRES_INIT_SQL: |
        CREATE ROLE studyai_app WITH LOGIN NOSUPERUSER;
        GRANT studyai_app TO studyai;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO studyai_app;
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyai}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Local development services (Phase 11)
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI / API
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    environment: &backend-env
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-1}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-1}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
      POSTGRES_DB: ${POSTGRES_DB:-studyai}
      POSTGRES_USER: ${POSTGRES_USER:-studyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: disable   # private docker network only
      CELERY_BROKER_URL: redis://redis:6379/0
      # Phase 11: Local provider configuration
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-studyai}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_SECURE: "false"
      OCR_PROVIDER_CHAIN: ${OCR_PROVIDER_CHAIN:-qwen35}
      OCR_PIPELINE_VERSION: ${OCR_PIPELINE_VERSION:-qwen35-v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_PROVIDER_CHAIN: ${LLM_PROVIDER_CHAIN:-ollama}
      LLM_DISABLE_FALLBACK: ${LLM_DISABLE_FALLBACK:-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence_transformers}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-qwen3-embedding-0.6b-v1}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-mailpit}
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: 1025
      MAILPIT_API_URL: http://mailpit:8025
      EMAIL_FROM: ${EMAIL_FROM:-noreply@studyai.local}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      ENRICHMENT_MODEL: ${ENRICHMENT_MODEL:-qwen3.5:4b}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-16384}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-4096}
      LLM_THINK_DEFAULT: ${LLM_THINK_DEFAULT:-0}
      LLM_THINK_OCR: ${LLM_THINK_OCR:-0}
      LLM_THINK_ENRICHMENT: ${LLM_THINK_ENRICHMENT:-0}
      LLM_THINK_GAP_DETECTION: ${LLM_THINK_GAP_DETECTION:-0}
      LLM_THINK_QUESTION_GEN: ${LLM_THINK_QUESTION_GEN:-0}
      LLM_THINK_CHAT: ${LLM_THINK_CHAT:-0}
      LLM_THINK_TAGGING: ${LLM_THINK_TAGGING:-0}
      LLM_THINK_VERIFICATION: ${LLM_THINK_VERIFICATION:-0}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}
      # Phase 12: LangSmith tracing (backend only)
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-studyai}
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - objectstore:/app/var/objectstore
      - django_static:/app/var/static
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://localhost:8000/healthz\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    environment: *backend-env
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - objectstore:/app/var/objectstore

  beat:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    environment: *backend-env
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
      - objectstore:/app/var/objectstore

  # Test runner service - uses test settings with hashing embedder and no LangSmith
  # Only started on demand (e.g. docker compose run --rm test)
  test:
    profiles:
      - test
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      <<: *backend-env
      DJANGO_SETTINGS_MODULE: config.settings.test
      EMBEDDING_PROVIDER: hashing
      EMBEDDING_MODEL_VERSION: hashing-1024-v1
      LANGSMITH_TRACING: "false"
    command: python -m pytest --tb=short
    volumes:
      - ./backend:/app
      - objectstore:/app/var/objectstore

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  objectstore:
  django_static:
  minio_data: