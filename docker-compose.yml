services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyai}
      POSTGRES_USER: ${POSTGRES_USER:-studyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyai}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Local development services (Phase 11)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI / API
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Optional: pre-pull models at build time
    # command: sh -c "ollama serve & sleep 10 && ollama pull llama3.1:8b && wait"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      ollama: { condition: service_healthy }
    environment: &backend-env
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-1}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-1}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
      POSTGRES_DB: ${POSTGRES_DB:-studyai}
      POSTGRES_USER: ${POSTGRES_USER:-studyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: disable   # private docker network only
      CELERY_BROKER_URL: redis://redis:6379/0
      # Phase 11: Local provider configuration
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-studyai}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_SECURE: "false"
      OCR_PROVIDER_CHAIN: ${OCR_PROVIDER_CHAIN:-tesseract,mock}
      LLM_PROVIDER_CHAIN: ${LLM_PROVIDER_CHAIN:-ollama,mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence_transformers}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-mailpit}
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: 1025
      MAILPIT_API_URL: http://mailpit:8025
      EMAIL_FROM: ${EMAIL_FROM:-noreply@studyai.local}
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - objectstore:/app/var/objectstore
      - django_static:/app/var/static
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://localhost:8000/healthz\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      ollama: { condition: service_healthy }
    environment: *backend-env
    command: celery -A config worker -l info
    volumes:
      - objectstore:/app/var/objectstore

  beat:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      ollama: { condition: service_healthy }
    environment: *backend-env
    command: celery -A config beat -l info
    volumes:
      - objectstore:/app/var/objectstore

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/var/www/django-static:ro
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  objectstore:
  django_static:
  minio_data:
  ollama_data: