components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_email:
          type: string
        action:
          type: string
          maxLength: 64
        resource_type:
          type: string
          maxLength: 64
        resource_id:
          type: string
          maxLength: 64
        metadata: {}
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - created_at
      - id
    CanvasPage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session:
          type: string
          format: uuid
        page_number:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_finalized:
          type: boolean
          readOnly: true
        finalized_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - finalized_at
      - id
      - is_finalized
      - page_number
      - session
    CanvasSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profile:
          type: string
          format: uuid
        subject:
          type: string
          format: uuid
          nullable: true
        device_id:
          type: string
          maxLength: 64
        lock_holder:
          type: string
          nullable: true
          maxLength: 64
        lock_generation:
          type: integer
          maximum: 2147483647
          minimum: 0
        lock_expires_at:
          type: string
          format: date-time
          nullable: true
        pages:
          type: array
          items: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device_id
      - id
      - pages
      - profile
      - updated_at
    CanvasSessionCreate:
      type: object
      properties:
        profile:
          type: string
          format: uuid
        device_id:
          type: string
          maxLength: 64
        subject:
          type: string
          format: uuid
          nullable: true
      required:
      - device_id
      - profile
    ChatSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
    DifficultyEnum:
      enum:
      - easy
      - medium
      - hard
      type: string
      description: |-
        * `easy` - easy
        * `medium` - medium
        * `hard` - hard
    DigitizedDocument:
      type: object
      properties:
        id:
          type: string
        document:
          type: string
        revision_ids:
          type: array
          items: {}
        pdf_ref:
          type: string
        renderer_version:
          type: string
        file_size:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - document
      - file_size
      - id
      - pdf_ref
      - renderer_version
      - revision_ids
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profile:
          type: string
          format: uuid
          nullable: true
        subject:
          type: string
          format: uuid
          nullable: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        source_type:
          $ref: '#/components/schemas/SourceTypeEnum'
        schema_version:
          type: string
          maxLength: 16
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - source
      - source_type
    Job:
      type: object
      properties:
        id:
          type: string
        job_type:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        status:
          type: string
        attempt_count:
          type: integer
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - attempt_count
      - created_at
      - id
      - job_type
      - last_error
      - resource_id
      - resource_type
      - status
    Notebook:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profile:
          type: string
          format: uuid
        subject:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        cover_image_ref:
          type: string
          nullable: true
          maxLength: 512
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - profile
      - title
      - updated_at
    NotebookCreate:
      type: object
      properties:
        profile:
          type: string
          format: uuid
        subject:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
      required:
      - profile
      - title
    NotebookPage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        notebook:
          type: string
          format: uuid
        page_number:
          type: integer
          maximum: 2147483647
          minimum: 0
        canvas_state: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - notebook
      - page_number
      - updated_at
    NotebookPageCreate:
