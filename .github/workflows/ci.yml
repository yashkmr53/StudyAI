name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: studyai
          POSTGRES_USER: studyai
          POSTGRES_PASSWORD: studyai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django coverage

      - name: Run migrations
        working-directory: ./backend
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        working-directory: ./backend
        run: |
          coverage run -m pytest --tb=short
          coverage xml
          coverage report --fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend

      - name: Check OpenAPI drift
        working-directory: ./backend
        run: |
          python manage.py spectacular --file /tmp/schema.yml
          git diff --exit-code docs/openapi/schema.yml || (echo "OpenAPI schema drifted; commit updated schema" && exit 1)

  frontend:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm run coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend

      - name: Build
        working-directory: ./frontend
        run: npm run build

  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # Dummy values for compose interpolation + HTTP smoke test only
      POSTGRES_PASSWORD: ci-dummy-password
      DJANGO_SECRET_KEY: ci-dummy-secret-key
      DJANGO_SECURE_SSL_REDIRECT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Test Docker compose up
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost/healthz
          curl -fsS http://localhost/readyz
          docker compose down -v

  openapi-drift:
    name: OpenAPI Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Generate OpenAPI schema
        working-directory: ./backend
        run: python manage.py spectacular --file /tmp/schema.yml

      - name: Check OpenAPI drift
        run: |
          git diff --exit-code docs/openapi/schema.yml || (echo "OpenAPI schema drifted; commit updated schema" && exit 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true