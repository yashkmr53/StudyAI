server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    # Frontend PWA static bundle
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    # API reverse proxy — use DNS resolver so nginx re-resolves
    # the upstream dynamically (survives API container restarts).
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Django admin reverse proxy
    location /admin/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Django collectstatic assets (admin CSS/JS), written by api into shared volume
    location /static/ {
        alias /var/www/django-static/;
        access_log off;
        expires 7d;
    }

    location = /healthz {
        resolver 127.0.0.11 valid=30s;
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api/healthz;
        proxy_set_header Host api;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /readyz {
        resolver 127.0.0.11 valid=30s;
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api/readyz;
        proxy_set_header Host api;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
