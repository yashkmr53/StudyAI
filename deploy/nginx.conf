server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    # Frontend PWA static bundle
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django admin reverse proxy
    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Django collectstatic assets (admin CSS/JS), written by api into shared volume
    location /static/ {
        alias /var/www/django-static/;
        access_log off;
        expires 7d;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host api;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /readyz {
        proxy_pass http://api:8000/readyz;
        proxy_set_header Host api;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
