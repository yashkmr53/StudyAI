openapi: 3.0.3
info:
  title: StudyAI API
  version: v1
paths:
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: Issues a fresh access/refresh token pair (§60).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      description: 'Blacklists the presented refresh token (§23: revocation strategy).'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/password-reset:
    post:
      operationId: v1_auth_password_reset_create
      description: Always returns 202; never reveals whether an email exists.
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/canvas/pages:
    post:
      operationId: v1_canvas_pages_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanvasPage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CanvasPage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CanvasPage'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasPage'
          description: ''
  /api/v1/canvas/pages/{id}:
    get:
      operationId: v1_canvas_pages_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasPage'
          description: ''
  /api/v1/canvas/pages/{id}/finalize:
    post:
      operationId: v1_canvas_pages_finalize_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanvasPage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CanvasPage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CanvasPage'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasPage'
          description: ''
  /api/v1/canvas/pages/{id}/strokes:
    post:
      operationId: v1_canvas_pages_strokes_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanvasPage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CanvasPage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CanvasPage'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasPage'
          description: ''
  /api/v1/canvas/sessions:
    get:
      operationId: v1_canvas_sessions_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCanvasSessionList'
          description: ''
    post:
      operationId: v1_canvas_sessions_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanvasSessionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CanvasSessionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CanvasSessionCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasSessionCreate'
          description: ''
  /api/v1/canvas/sessions/{id}:
    get:
      operationId: v1_canvas_sessions_retrieve
      parameters:
      - in: path
        name: id
