components:
  schemas:
    CanvasPage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session:
          type: string
          format: uuid
        page_number:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_finalized:
          type: boolean
          readOnly: true
        finalized_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - finalized_at
      - id
      - is_finalized
      - page_number
      - session
    CanvasSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profile:
          type: string
          format: uuid
        subject:
          type: string
          format: uuid
          nullable: true
        device_id:
          type: string
          maxLength: 64
        lock_holder:
          type: string
          nullable: true
          maxLength: 64
        lock_generation:
          type: integer
          maximum: 2147483647
          minimum: 0
        lock_expires_at:
          type: string
          format: date-time
          nullable: true
        pages:
          type: array
          items: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device_id
      - id
      - pages
      - profile
      - updated_at
    CanvasSessionCreate:
      type: object
      properties:
        profile:
          type: string
          format: uuid
        device_id:
          type: string
          maxLength: 64
        subject:
          type: string
          format: uuid
          nullable: true
      required:
      - device_id
      - profile
    ChatSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
    DigitizedDocument:
      type: object
      properties:
        id:
          type: string
        document:
          type: string
        revision_ids:
          type: array
          items: {}
        pdf_ref:
          type: string
        renderer_version:
          type: string
        file_size:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - document
      - file_size
      - id
      - pdf_ref
      - renderer_version
      - revision_ids
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profile:
          type: string
          format: uuid
          nullable: true
        subject:
          type: string
          format: uuid
          nullable: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        source_type:
          $ref: '#/components/schemas/SourceTypeEnum'
        schema_version:
          type: string
          maxLength: 16
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - source
      - source_type
    Job:
      type: object
      properties:
        id:
          type: string
        job_type:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        status:
          type: string
        attempt_count:
          type: integer
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - attempt_count
      - created_at
      - id
      - job_type
      - last_error
      - resource_id
      - resource_type
      - status
    PaginatedCanvasSessionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CanvasSession'
    PaginatedChatSessionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ChatSession'
    PaginatedDigitizedDocumentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/DigitizedDocument'
    PaginatedDocumentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Document'
    PaginatedProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
    PaginatedSubjectList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
    PatchedProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSubject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profile:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    SourceEnum:
      enum:
      - upload
      - canvas
      - reference
      type: string
      description: |-
        * `upload` - upload
        * `canvas` - canvas
        * `reference` - reference
    SourceTypeEnum:
      enum:
      - image
      - pdf
      - canvas_page
      - reference
      type: string
      description: |-
        * `image` - image
        * `pdf` - pdf
        * `canvas_page` - canvas_page
        * `reference` - reference
    Subject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profile:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - profile
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
